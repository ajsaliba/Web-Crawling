---
# Part 4 - config for a generic crawling engine.
# Target: www.allbirds.com (Shopify Plus), the site investigated in Part 3.
#
# The engine is generic, so this file says where data lives and how much to
# trust each location, never how to fetch it. Every extraction rule is an
# ordered list of sources: try them in turn, take the first that yields a
# value. Contractual sources at the top, fragile ones at the bottom, so a
# theme redesign degrades the output instead of breaking it.
#
# Source types:
#   json_endpoint  separate request returning JSON, read by path
#   json_ld        <script type="application/ld+json"> in the page
#   json_in_html   a JS object literal, located by regex
#   css / xpath    selectors against the parsed DOM
#   regex          last resort, against the raw body
#
# Every figure quoted comes from site_report.md.

domain: www.allbirds.com

meta:
  platform: shopify              # confirmed via `powered-by: Shopify` header
  currency: USD                  # from JSON-LD offers.priceCurrency
  # Other regions live under /en-gb/, /en-ca/ and so on. Those would be separate
  # configs, not a runtime switch, so prices never get mixed silently.

# transport - how requests are made
transport:
  strategy: http                 # NOT browser: see site_report.md section A.
  # A plain request returns the whole product page: h1, JSON-LD, the variant
  # array, 35 images, 3 videos. A browser would cost far more for no extra
  # data. Escalate only if the checks under `validation` start failing.

  http:
    # No need to spoof: curl's default UA gets the same bytes back.
    user_agent: "lau-crawler/1.0 (+https://example.com/crawler; contact@example.com)"
    headers:
      Accept: "text/html,application/xhtml+xml,application/json;q=0.9"
      Accept-Language: "en-US,en;q=0.9"
    timeout_seconds: 30
    follow_redirects: true       # required: stale handles 301 to collections
    max_redirects: 5

  politeness:
    concurrency: 4
    delay_seconds: 1.0
    autothrottle: true
    respect_robots_txt: true
    # robots.txt disallows /cart, /checkout, /account, /orders and faceted
    # collection URLs. /products/ and plain /collections/ are fine.

  retry:
    max_attempts: 3
    backoff: exponential
    retry_on_status: [408, 429, 500, 502, 503, 504]
    # 404 is not retried. A dead handle here 301s to a collection and returns
    # 200, so a real 404 means what it says.

# discovery - how the crawler finds product URLs
#
# Not "follow every <a> on the collection page", and for a measured reason: the
# collection HTML exposes only 5 anchors for 218 products (the grid is hydrated
# from embedded JSON). Anchor-following would silently lose most of the catalogue.
discovery:
  # Primary. 291 product URLs, with <lastmod> so re-crawls can be incremental.
  - type: sitemap
    url: https://www.allbirds.com/sitemap.xml
    follow_sitemap_index: true
    include: '/sitemap_products_\d+\.xml'
    priority: 1

  # Secondary. 250 full product objects per request, useful for re-crawling
  # one category.
  - type: json_endpoint
    url_template: "https://www.allbirds.com/collections/{collection}/products.json?limit=250&page={page}"
    items_path: "$.products[*]"
    pagination:
      style: page_number
      start: 1
      # Empty products array past the last page, so stop there rather than
      # hard-coding a count.
      stop_when: "$.products length == 0"
    priority: 2

# How URLs are classified. Anchored, because an unanchored /products/ would
# also match /collections/x/products/y and send it to the wrong parser.
url_patterns:
  search:
    # Collection pages are the real listing surface here. /search is rendered
    # client-side, so it is no use for discovery.
    - '^https://www\.allbirds\.com/collections/[a-z0-9-]+/?$'
    - '^https://www\.allbirds\.com/collections/[a-z0-9-]+/products\.json'

  product:
    - '^https://www\.allbirds\.com/products/(?P<handle>[a-z0-9-]+)/?(?:\?.*)?$'

  exclude:
    - '/cart'
    - '/checkout'
    - '/account'
    - '/orders'
    - '\?.*sort_by='            # faceted duplicates, disallowed by robots.txt
    - '\?.*variant='            # same product, different variant selected

  # The handle alone identifies a product, so ?variant=, ?v= and UTM params
  # must not create new items.
  canonical:
    template: "https://www.allbirds.com/products/{handle}"
    strip_query_params: true

# Sources are tried in order; first non-empty result wins.
extraction:

  # One extra request per product that several fields below read from. At 8 KB
  # it is far cheaper than parsing the 687 KB page.
  companion_requests:
    product_json:
      url_template: "https://www.allbirds.com/products/{handle}.json"
      required: false           # fall back to HTML sources if it ever 404s

  title:
    sources:
      - type: json_endpoint     # authoritative: the store's own product record
        request: product_json
        path: "$.product.title"
      - type: json_ld
        path: "$[?(@['@type'] in ['Product','ProductGroup'])].name"
      - type: css
        selector: "h1"
        get: text
    post_process: [strip, collapse_whitespace]

  description:
    sources:
      - type: json_endpoint
        request: product_json
        path: "$.product.body_html"
      - type: json_ld
        path: "$..description"
    post_process: [strip_html_tags, collapse_whitespace]

  price:
    sources:
      - type: json_endpoint
        request: product_json
        path: "$.product.variants[0].price"     # decimal string, e.g. "110.00"
      - type: json_ld
        path: "$..offers.price"
      - type: json_in_html
        # `var meta` prices are in CENTS (11000 = $110.00). Last on the list
        # because that mismatch is an easy silent bug.
        locator: 'var meta\s*=\s*(?P<json>\{)'
        path: "$.product.variants[0].price"
        transform: divide_by_100
    output_type: float

  availability:
    sources:
      - type: json_ld
        path: "$..offers.availability"          # schema.org/InStock
      - type: json_endpoint
        request: product_json
        path: "$.product.variants[*].available"
        reduce: any                             # in stock if ANY variant is
    output_type: enum
    map:
      "https://schema.org/InStock": in_stock
      "https://schema.org/OutOfStock": out_of_stock
      true: in_stock
      false: out_of_stock

  images:
    # Ordered list; first entry is treated as the main image.
    sources:
      - type: json_endpoint
        request: product_json
        path: "$.product.images[*].src"
      - type: json_ld
        path: "$[?(@['@type']=='ProductGroup')].image[*]"
      - type: css
        selector: 'meta[property="og:image"]'
        get: attr:content
      - type: regex
        # Absolute last resort - matches any product CDN asset in the body.
        pattern: 'https://[^"''\s]*/cdn/shop/(?:files|products)/[^"''\s?]+\.(?:jpg|jpeg|png|webp)'
    post_process:
      # Shopify appends ?v=<timestamp>&width=<n>. Without stripping it the same
      # asset gets stored many times over.
      - strip_query_string
      - absolutize                              # resolve //cdn... and /cdn/...
      - deduplicate
    min_expected: 1                             # 0 images => extraction broke

  videos:
    # Not in products.json, so the HTML is the only source.
    sources:
      - type: regex
        pattern: 'https://[^"''\s]*/cdn/shop/videos/[^"''\s]+\.mp4'
      - type: css
        selector: "video source"
        get: attr:src
    post_process: [absolutize, deduplicate]
    prefer_format: mp4
    # The same clips are also exposed as .m3u8. Prefer .mp4: one download
    # instead of a manifest plus segments.
    ignore_patterns: ['\.m3u8$']
    required: false                             # many products have no video

  variants:
    # The only source with per-variant price, sku, stock and image. JSON-LD
    # hasVariant here holds only {"@type","url"} stubs, so it cannot stand in.
    source:
      type: json_endpoint
      request: product_json
      items_path: "$.product.variants[*]"

    fields:
      variant_id: "$.id"
      sku: "$.sku"
      price: "$.price"
      compare_at_price: "$.compare_at_price"
      available: "$.available"
      stock: "$.inventory_quantity"
      barcode: "$.barcode"

      # option1/2/3 are positional; the names live in product.options[].
      # Zipping by index turns ["8"] into {"Size": "8"}, so the consumer does
      # not have to guess what option1 meant.
      options:
        strategy: zip_positional
        names_path: "$.product.options[*].name"     # e.g. ["Size"] / ["Size","Color"]
        values_path: ["$.option1", "$.option2", "$.option3"]
        drop_null: true

      # Binds each variant to its own picture. Skipping this is why colour
      # variants so often end up sharing one image.
      image:
        strategy: lookup
        key: "$.image_id"
        against: "$.product.images[*]"
        match_on: "$.id"
        take: "$.src"
        fallback: "$.product.images[0].src"

  product_url:
    sources:
      - type: template
        value: "https://www.allbirds.com/products/{handle}"
      - type: css
        selector: 'link[rel="canonical"]'
        get: attr:href

# What makes a response trustworthy. Answers Scenario 1 of Part 5, and guards
# something seen live: a stale handle 301s to a collection and returns 200 on
# a non-product page. Status alone proves nothing.
validation:
  response:
    expect_status: [200]
    # The page has to claim it is a product page.
    require_any:
      - type: regex
        pattern: '"rtyp":"product"'          # Shopify's own page-type marker
      - type: json_ld
        path: "$[?(@['@type'] in ['Product','ProductGroup'])]"
    # A redirect that changes the path class is a soft 404.
    reject_if_redirected_to: '^https://www\.allbirds\.com/collections/'
    reject_if_body_matches:
      - '(?i)just a moment'                  # generic challenge-page wording
      - '(?i)access denied'

  item:
    required_fields: [title, product_url, images]
    warn_if_missing: [price, variants, description]
    # One product without a title is bad data. Ninety percent without one is a
    # broken selector, so fail the run rather than the item.
    fail_run_if_missing_ratio: 0.10

  run:
    # Sanity check on discovery. The sitemap listed 291 on 18 Aug 2026; a real
    # deployment would re-read that per run rather than pin it.
    expected_item_count: 291
    fail_if_below_ratio: 0.80      # <245 items => investigate before publishing
